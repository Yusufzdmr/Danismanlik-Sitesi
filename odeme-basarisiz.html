<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Başarısız | TK Danışmanlık</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f0f23, #1a1a2e); }
        .card { background: #fff; border-radius: 20px; padding: 60px; text-align: center; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .icon { width: 100px; height: 100px; margin: 0 auto 24px; border-radius: 50%; background: #fee2e2; display: flex; align-items: center; justify-content: center; }
        .icon i { font-size: 3rem; color: #dc2626; }
        h1 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 12px; color: #1a1a2e; }
        p { color: #64748b; margin-bottom: 24px; line-height: 1.7; }
        .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(233,69,96,0.4); }
        .btn-outline { background: transparent; color: #1a1a2e; border: 2px solid #e2e8f0; }
        .btn-outline:hover { border-color: #e94560; color: #e94560; box-shadow: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-times-circle"></i></div>
        <h1>Odeme Basarisiz</h1>
        <p>Odeme islemi tamamlanamadi. Kart bilgilerinizi kontrol ederek tekrar deneyebilirsiniz veya bizimle iletisime gecebilirsiniz.</p>
        <div class="buttons">
            <a href="index.html#appointment" class="btn"><i class="fas fa-redo"></i> Tekrar Dene</a>
            <a href="index.html#contact" class="btn btn-outline"><i class="fas fa-envelope"></i> Iletisim</a>
        </div>
    </div>
</body>
</html>
